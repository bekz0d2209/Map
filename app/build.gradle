plugins {
    id 'com.android.application'
}

android {
    namespace 'uz.bekzod.fogmap'
    compileSdk 34

    defaultConfig {
        applicationId 'uz.bekzod.fogmap'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.3'
    }

    signingConfigs {
        fixed {
            storeFile file('fogmap.jks')
            storePassword 'fogmap123'
            keyAlias 'fogmap'
            keyPassword 'fogmap123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.osmdroid:osmdroid-android:6.1.18'
}
